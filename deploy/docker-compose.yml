# =====================================================
# docker-compose.yml - Government Agent Platform
# Author: le
# Date: 2026/7/30
# Version: 0.2
# Task: Docker Compose orchestration for all infrastructure services
# =====================================================
# Services: postgres (pgvector), redis, milvus-standalone
#
# Port convention (all offset +2):
#   PostgreSQL → 5434  (standard 5432 + 2)
#   Redis       → 6480  (6380-6479 blocked by Windows excluded port range)
#   Milvus      → 19532 (standard 19530 + 2)
#
# Usage:
#   docker compose up -d              # 启动所有服务
#   docker compose ps                  # 查看运行状态
#   docker compose down               # 停止并清理
#   docker compose down -v            # 停止并删除数据卷
# =====================================================

services:

  # ──────────────────────────────────────
  # API — FastAPI Backend (端口 8002)
  # ──────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: gov_agent_api
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      APP_PORT: 8002
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MILVUS_HOST: milvus
      MILVUS_PORT: 19530
      MCP_GATEWAY_URL: http://mcp-server:12300
      A2A_CALLBACK_URL: http://api:8002/api/a2a/callback
    volumes:
      - ../models:/app/models
      - ../data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mcp-server:
        condition: service_started
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # MCP Servers + Gateway (端口 12300-12303)
  # ──────────────────────────────────────
  mcp-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.mcp
    container_name: gov_agent_mcp
    restart: unless-stopped
    ports:
      - "12300:12300"
      - "12301:12301"
      - "12302:12302"
      - "12303:12303"
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # PostgreSQL 16 + pgvector extension
  # ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gov_agent_postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: gov_agent
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: gov_agent_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gov_agent -d gov_agent_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Redis 7
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gov_agent_redis
    restart: unless-stopped
    ports:
      - "6480:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Milvus 2.5 Standalone
  # ──────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.5.1
    container_name: gov_agent_milvus
    restart: unless-stopped
    ports:
      - "19532:19530"
      - "9091:9091"
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - gov_agent_net

# ──────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────
volumes:
  pgdata:
    name: gov_agent_pgdata
  redisdata:
    name: gov_agent_redisdata
  milvusdata:
    name: gov_agent_milvusdata

# ──────────────────────────────────────
# Network
# ──────────────────────────────────────
networks:
  gov_agent_net:
    name: gov_agent_net
    driver: bridge
