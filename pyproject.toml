# =====================================================
# pyproject.toml - Government Agent Platform
# Author: le
# Date: 2026/8/2
# Version: 0.1
# Task: Pytest + Ruff + Mypy tool configuration
# =====================================================

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
# E501 行长忽略；B008 依赖注入缺省可调用参数（FastAPI Depends 惯例）
# E402 允许 sys.path/循环导入后的延迟 import（logger/checkpointer/migrations 惯例）
# B904 允许 except 内直接 raise（多数为 HTTPException 包装，行为已定义）
# B905 允许 zip 不带 strict（现有调用均为等长列表）
ignore = ["E501", "B008", "E402", "B904", "B905"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
