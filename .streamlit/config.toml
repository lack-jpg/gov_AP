# =====================================================
# .streamlit/config.toml - Streamlit 前端配置
# 端口对齐项目 FRONTEND_PORT (12345)
#
# 若修改 .env 中的 FRONTEND_PORT，请同步更新此处 port。
# =====================================================

[server]
port = 12345
headless = true
# 禁止浏览器自动打开（服务器/容器环境友好）
runOnSave = false

[browser]
gatherUsageStats = false

# =====================================================
# 主题 — 浅色专业政务风（design-system/default/MASTER.md）
# 政务蓝 #1E40AF · 服务绿 #16A34A · 背景 #F6F8FB
# =====================================================
[theme]
base = "light"
primaryColor = "#1E40AF"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#EFF6FF"
textColor = "#1F2A44"
font = "sans serif"
