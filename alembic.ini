# =====================================================
# alembic.ini - Alembic database migration config
# Author: le
# Date: 2026/8/2
# Version: 0.1
# Task: Alembic migration configuration for PostgreSQL schema management
#
# The DB URL is resolved dynamically from backend.config in env.py,
# so sqlalchemy.url below is left empty (overridden at runtime).
#
# Usage:
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#   alembic downgrade -1
#   alembic current
#   alembic history
# =====================================================

[alembic]
script_location = database/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
