# =====================================================
# docker-compose.yml - Government Agent Platform
# Author: le
# Date: 2026/8/2
# Version: 0.3
# Task: Docker Compose orchestration for all services
#
# 位置说明: 放在仓库根目录，`docker compose up -d` 直接可用。
# 密码从同目录 .env 读取（POSTGRES_PASSWORD / REDIS_PASSWORD），
# 不再硬编码。
#
# 端口约定（宿主端口，通过 .env / ${VAR:-default} 可覆盖）:
#   Frontend    12345
#   API         8002
#   MCP Gateway 12300 | Servers 12301-12303
#   A2A Mock    12201 housing | 12202 fund
#   PostgreSQL  5658  (避开 Hyper-V 保留区间 5358-5457)
#   Redis       6500  (避开 Windows 保留端口区间 6380-6479)
#   Milvus      19532 (标准端口 19530 + 2，避免本地冲突)
#
# 重要：容器内服务间通信使用内部端口（PostgreSQL:5432, Redis:6379, Milvus:19530）
#        config.py 中的默认端口用于本地开发环境（直连宿主机）
#
# Usage:
#   docker compose config        # 校验配置
#   docker compose up -d         # 启动所有服务
#   docker compose ps            # 查看状态
#   docker compose down -v       # 停止并删除数据卷
# =====================================================

services:

  # ──────────────────────────────────────
  # API — FastAPI Backend (端口 8002)
  # ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gov_agent_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8002}:8002"
    environment:
      APP_PORT: 8002
      # LLM（从 .env 注入，密钥不写入镜像）
      # 注意：容器内 localhost 指向容器自身！Docker Desktop 访问宿主机应用 host.docker.internal
      # 或设置环境变量 LLM_API_URL=http://192.168.x.x:8000/v1 指向宿主机/LLM 服务 IP
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-14b-instruct}
      # 容器间通过服务名通信
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-gov_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gov_agent_platform}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MCP_GATEWAY_URL: http://mcp-server:12300
      # A2A：回调地址指向本 api，外部 Agent 地址指向 a2a-mock 服务
      A2A_CALLBACK_URL: http://api:8002/api/a2a/callback
      A2A_HOUSING_URL: http://a2a-mock:12201
      A2A_FUND_URL: http://a2a-mock:12202
      A2A_HMAC_SECRET: ${A2A_HMAC_SECRET:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logger:/app/logger          # 日志输出到宿主机，方便查看和采集
      - ./evaluation_results:/app/evaluation_results  # 评测报告文件回退读取（evaluation_report API）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      mcp-server:
        condition: service_started
      a2a-mock:
        condition: service_started
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # A2A Mock Agents (端口 12201 housing / 12202 fund)
  # ──────────────────────────────────────
  a2a-mock:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    container_name: gov_agent_a2a
    restart: unless-stopped
    ports:
      - "12201:12201"
      - "12202:12202"
    environment:
      A2A_HMAC_SECRET: ${A2A_HMAC_SECRET:-}
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Frontend — Streamlit UI (端口 12345)
  # ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: gov_agent_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-12345}:12345"
    environment:
      # 后端 API 地址（容器间服务名通信）
      API_BASE_URL: http://api:8002
    depends_on:
      - api
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # MCP Servers + Gateway (端口 12300-12303)
  # ──────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp
    container_name: gov_agent_mcp
    restart: unless-stopped
    ports:
      - "12300:12300"
      - "12301:12301"
      - "12302:12302"
      - "12303:12303"
    environment:
      # 与 api 共享 JWT 密钥：Gateway 校验 MCP Client 的 Bearer Token 必须用同一密钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-changeme}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # PostgreSQL 16 + pgvector extension
  # ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gov_agent_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5658}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gov_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gov_agent_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gov_agent} -d ${POSTGRES_DB:-gov_agent_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Redis 7 (支持密码)
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gov_agent_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"]
    ports:
      - "${REDIS_PORT:-6500}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Milvus 2.5 Standalone
  # ──────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.5.1
    container_name: gov_agent_milvus
    restart: unless-stopped
    ports:
      - "${MILVUS_PORT:-19532}:19530"
      # Milvus 健康检查端口仅容器内使用，不映射到宿主机（避免 Windows 端口冲突）
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Prometheus — 指标抓取 + 告警规则（端口 9090）
  # ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gov_agent_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
      - alertmanager
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Alertmanager — 告警路由（端口 9093）
  # ──────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gov_agent_alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Grafana — 可视化看板（端口 3000）
  # ──────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: gov_agent_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gov_agent_net

# ──────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────
volumes:
  pgdata:
    name: gov_agent_pgdata
  redisdata:
    name: gov_agent_redisdata
  milvusdata:
    name: gov_agent_milvusdata
  promdata:
    name: gov_agent_promdata
  grafanadata:
    name: gov_agent_grafanadata

# ──────────────────────────────────────
# Network
# ──────────────────────────────────────
networks:
  gov_agent_net:
    name: gov_agent_net
    driver: bridge
