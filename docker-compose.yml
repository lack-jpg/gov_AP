# =====================================================
# docker-compose.yml - Government Agent Platform
# Author: le
# Date: 2026/8/2
# Version: 0.3
# Task: Docker Compose orchestration for all services
#
# 位置说明: 放在仓库根目录，`docker compose up -d` 直接可用。
# 密码从同目录 .env 读取（POSTGRES_PASSWORD / REDIS_PASSWORD），
# 不再硬编码。
#
# 端口约定（宿主端口，通过 .env / ${VAR:-default} 可覆盖；组内 +10 步进，中间留 9 空位）:
#   MCP       12001 Gateway | 12011 Policy | 12021 Material | 12031 Workflow
#   A2A       12101 housing | 12111 fund
#   DB        12201 Redis | 12211 Milvus | 12221 Postgres
#   Frontend  12345
#   其他      12401 API | 12411 Prometheus | 12421 Grafana | 12431 Alertmanager
#
# 重要：容器内服务间通信使用内部端口（PostgreSQL:5432, Redis:6379, Milvus:19530,
#        MCP 12001-12031, A2A 12101/12111, API 12401）
#        config.py 中的默认端口用于本地开发环境（直连宿主机）
#
# Usage:
#   docker compose config        # 校验配置
#   docker compose up -d         # 启动所有服务
#   docker compose ps            # 查看状态
#   docker compose down -v       # 停止并删除数据卷
# =====================================================

services:

  # ──────────────────────────────────────
  # API — FastAPI Backend (端口 12401)
  # ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    container_name: gov_agent_api
    restart: unless-stopped
    ports:
      - "${APP_PORT:-12401}:12401"
    environment:
      APP_PORT: 12401
      # LLM（从 .env 注入，密钥不写入镜像）
      # 注意：容器内 localhost 指向容器自身！Docker Desktop 访问宿主机应用 host.docker.internal
      # 或设置环境变量 LLM_API_URL=http://192.168.x.x:8000/v1 指向宿主机/LLM 服务 IP
      LLM_API_URL: ${LLM_API_URL:-http://host.docker.internal:8000/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5-14b-instruct}
      # 容器间通过服务名通信（容器内端口）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-gov_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gov_agent_platform}
      # P4-7：生产禁止 create_all 兜底——迁移失败容器启动即失败（schema 版本受 alembic_version 管理）
      DB_ALLOW_CREATE_ALL: ${DB_ALLOW_CREATE_ALL:-false}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      MCP_GATEWAY_URL: http://mcp-server:12001
      # A2A：回调地址指向本 api，外部 Agent 地址指向 a2a-mock 服务
      A2A_CALLBACK_URL: http://api:12401/api/a2a/callback
      A2A_HOUSING_URL: http://a2a-mock:12101
      A2A_FUND_URL: http://a2a-mock:12111
      A2A_HMAC_SECRET: ${A2A_HMAC_SECRET:-}
      # P1-6 A2A 可靠性：生产禁止 stub 降级（外部 Agent 不可达时任务明确失败并记录原因），
      #                 仅本地开发需演示 stub 时显式设置 A2A_ALLOW_STUB=true
      A2A_ALLOW_STUB: ${A2A_ALLOW_STUB:-false}
      A2A_HTTP_RETRIES: ${A2A_HTTP_RETRIES:-2}
      # 安全基线：JWT 密钥缺失或为空时直接拒绝启动，禁止 changeme 兜底
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须设置且不能使用默认值 changeme}
      # 默认管理员账号（启动时 User 表为空才 seed；生产务必通过 .env 覆盖 AUTH_ADMIN_PASSWORD）
      AUTH_ADMIN_USERNAME: ${AUTH_ADMIN_USERNAME:-admin}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-admin123}
      AUTH_ADMIN_TENANT_ID: ${AUTH_ADMIN_TENANT_ID:-default}
      # P2-6 可观测性：容器内 OTLP 指向 otel-collector（覆盖 config.py 默认 localhost:4319）
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      # P2-6 LangSmith 自动追踪（config 用 LANGSMITH_*，langsmith 读 LANGCHAIN_*，main.py 已做映射）
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-true}
      LANGCHAIN_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGCHAIN_PROJECT: ${LANGSMITH_PROJECT:-gov-agent-platform}
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./logger:/app/logger          # 日志输出到宿主机，方便查看和采集
      - ./evaluation_results:/app/evaluation_results  # 评测报告文件回退读取（evaluation_report API）
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_healthy
      # 第三方镜像无内置 HEALTHCHECK，只能等待 started；业务依赖收紧到 healthy
      otel-collector:
        condition: service_started
      mcp-server:
        condition: service_healthy
      a2a-mock:
        condition: service_healthy
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # A2A Mock Agents (端口 12101 housing / 12111 fund)
  # ──────────────────────────────────────
  a2a-mock:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    container_name: gov_agent_a2a
    restart: unless-stopped
    ports:
      - "12101:12101"
      - "12111:12111"
    environment:
      A2A_HMAC_SECRET: ${A2A_HMAC_SECRET:-}
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Frontend — Streamlit UI (端口 12345)
  # ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: gov_agent_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-12345}:12345"
    environment:
      # 后端 API 地址（容器间服务名通信）
      API_BASE_URL: http://api:12401
    depends_on:
      api:
        condition: service_healthy
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # MCP Servers + Gateway (端口 12001/12011/12021/12031)
  # ──────────────────────────────────────
  mcp-server:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mcp
    container_name: gov_agent_mcp
    restart: unless-stopped
    ports:
      - "12001:12001"
      - "12011:12011"
      - "12021:12021"
      - "12031:12031"
    environment:
      # 与 api 共享 JWT 密钥：Gateway 校验 MCP Client 的 Bearer Token 必须用同一密钥
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY 必须设置且不能使用默认值 changeme}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # P1-5 办件落库：workflow_server 经 PostgreSQL 创建/查询办件
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-gov_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gov_agent_platform}
      # 真实 RAG 主链路：policy_server 经 rag.pipeline 检索，需连 Milvus（服务名 milvus，容器内 19530）
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
    volumes:
      # 语料与模型由宿主机挂入（镜像已由 .dockerignore 排除 data/models，构建时不含）
      # 只读挂载：mcp-server 以非 root mcpuser 运行，Windows bind mount 目录为 root 所有，
      # 本服务只读语料/模型（写入走 Milvus/PostgreSQL 网络），无需可写权限。
      - ./data:/app/data:ro
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # PostgreSQL 16 + pgvector extension
  # ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gov_agent_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-12221}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gov_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-gov_agent_platform}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gov_agent} -d ${POSTGRES_DB:-gov_agent_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Redis 7 (支持密码)
  # ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gov_agent_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"]
    ports:
      - "${REDIS_PORT:-12201}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "sh", "-c", "redis-cli ${REDIS_PASSWORD:+-a ${REDIS_PASSWORD}} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Milvus 2.5 Standalone
  # ──────────────────────────────────────
  milvus:
    image: milvusdb/milvus:v2.5.1
    container_name: gov_agent_milvus
    restart: unless-stopped
    ports:
      - "${MILVUS_PORT:-12211}:19530"
      # Milvus 健康检查端口仅容器内使用，不映射到宿主机（避免 Windows 端口冲突）
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    volumes:
      - milvusdata:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Prometheus — 指标抓取 + 告警规则（宿主端口 12411）
  # ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: gov_agent_prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-12411}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - promdata:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - api
      - alertmanager
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Alertmanager — 告警路由（宿主端口 12431）
  # ──────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: gov_agent_alertmanager
    restart: unless-stopped
    ports:
      - "${ALERTMANAGER_PORT:-12431}:9093"
    environment:
      # P4-6：通知通道 URL 通过环境变量注入（无需手改 alertmanager.yml）。
      # 生产把 ALERTMANAGER_WEBHOOK_URL 指向真实群机器人（飞书/钉钉/企微/Slack）。
      # Watchdog 自检走独立 echo 端点，不污染业务通道。
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-http://host.docker.internal:8000/alert}
      ALERTMANAGER_WATCHDOG_WEBHOOK_URL: ${ALERTMANAGER_WATCHDOG_WEBHOOK_URL:-http://host.docker.internal:18000/alert}
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    # prom/alertmanager 镜像自带 ENTRYPOINT ["/bin/alertmanager"]，
    # 若只设 command 会被拼到入口后变成 `alertmanager sh ...`（"unexpected sh"）。
    # 用 entrypoint: [] 清空镜像入口，改用 sh -c 做 sed 环境变量替换再启动。
    entrypoint: []
    # Alertmanager 原生不支持 env 展开，此处用 sed 将占位符替换为环境变量再启动。
    # 注意：命令必须是单行 shell 脚本——YAML 折叠块会保留换行，多行会把
    # sed 的参数行拆成独立命令（shell 去执行 alertmanager.yml 报 "line N: -: not found"）。
    # (URL 不含 '|'，作为 sed 分隔符安全)
    command:
      - /bin/sh
      - -c
      - 'sed "s|__ALERTMANAGER_WEBHOOK_URL__|$${ALERTMANAGER_WEBHOOK_URL}|g; s|__ALERTMANAGER_WATCHDOG_WEBHOOK_URL__|$${ALERTMANAGER_WATCHDOG_WEBHOOK_URL}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager'
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # Grafana — 可视化看板（宿主端口 12421）
  # ──────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: gov_agent_grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-12421}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - gov_agent_net

  # ──────────────────────────────────────
  # OpenTelemetry Collector — Trace 采集（OTLP gRPC 4317，宿主端口 4319）
  # 配置: deploy/otel/otel-collector.yml（OTLP → batch → debug，本地可查调用链）
  # ──────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.121.0
    container_name: gov_agent_otel
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./deploy/otel/otel-collector.yml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_COLLECTOR_PORT:-4319}:4317"
    networks:
      - gov_agent_net

# ──────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────
volumes:
  pgdata:
    name: gov_agent_pgdata
  redisdata:
    name: gov_agent_redisdata
  milvusdata:
    name: gov_agent_milvusdata
  promdata:
    name: gov_agent_promdata
  grafanadata:
    name: gov_agent_grafanadata

# ──────────────────────────────────────
# Network
# ──────────────────────────────────────
networks:
  gov_agent_net:
    name: gov_agent_net
    driver: bridge
